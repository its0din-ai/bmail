<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="bmail-banner-title bmail-banner-desc">
  <title id="bmail-banner-title">bmail - inbound email for agents on Cloudflare Workers and R2</title>
  <desc id="bmail-banner-desc">Neo brutalist banner. bmail stores received mail in Cloudflare R2, runs on Cloudflare Workers, uses Email Routing for inbound mail, and exposes a REST API and MCP server.</desc>

  <rect width="1280" height="400" fill="#FFE45C"/>
  <rect x="36" y="36" width="1208" height="328" fill="#111111"/>
  <rect x="24" y="24" width="1208" height="328" fill="#FFFDF5" stroke="#111111" stroke-width="8"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="80" y="168" font-size="132" font-weight="900" letter-spacing="-4" fill="#5294FF">bmail</text>
    <text x="72" y="160" font-size="132" font-weight="900" letter-spacing="-4" fill="#111111">bmail</text>

    <rect x="72" y="188" width="156" height="36" rx="4" fill="#111111"/>
    <text x="150" y="213" text-anchor="middle" font-size="18" font-weight="700" letter-spacing="2" fill="#FFFDF5">bountyMail</text>

    <text x="72" y="262" font-size="25" font-weight="700" fill="#111111">Inbound mail for autonomous agents</text>

    <g font-size="16" font-weight="700" fill="#111111">
      <rect x="72" y="286" width="202" height="38" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <text x="173" y="312" text-anchor="middle">Cloudflare Workers</text>

      <rect x="286" y="286" width="64" height="38" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <text x="318" y="312" text-anchor="middle">R2</text>

      <rect x="362" y="286" width="158" height="38" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <text x="441" y="312" text-anchor="middle">Email Routing</text>

      <rect x="532" y="286" width="82" height="38" rx="4" fill="#FFFDF5" stroke="#111111" stroke-width="4"/>
      <text x="573" y="312" text-anchor="middle">MCP</text>

      <rect x="626" y="286" width="126" height="38" rx="4" fill="#05E17A" stroke="#111111" stroke-width="4"/>
      <text x="689" y="312" text-anchor="middle">Free tier</text>
    </g>

    <text x="72" y="344" font-size="15" font-weight="700" letter-spacing="1" fill="#111111">RECEIVE → STORE → POLL → READ → ACK</text>

    <rect x="792" y="76" width="404" height="270" fill="#111111"/>
    <rect x="780" y="64" width="404" height="270" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>

    <text x="808" y="108" font-size="17" font-weight="700" letter-spacing="3" fill="#111111">BUILT ON</text>
    <text x="808" y="146" font-size="34" font-weight="900" letter-spacing="-1" fill="#111111">CLOUDFLARE</text>
    <rect x="1132" y="82" width="28" height="28" fill="#F38020" stroke="#111111" stroke-width="4"/>

    <g font-size="18" font-weight="700" fill="#111111">
      <rect x="808" y="180" width="14" height="14" fill="#F38020" stroke="#111111" stroke-width="3"/>
      <text x="836" y="194">Workers</text>

      <rect x="808" y="214" width="14" height="14" fill="#5294FF" stroke="#111111" stroke-width="3"/>
      <text x="836" y="228">Email Routing</text>

      <rect x="808" y="248" width="14" height="14" fill="#05E17A" stroke="#111111" stroke-width="3"/>
      <text x="836" y="262">R2</text>

      <rect x="808" y="282" width="14" height="14" fill="#FF6B6B" stroke="#111111" stroke-width="3"/>
      <text x="836" y="296">Wrangler</text>
    </g>

    <text x="808" y="318" font-size="13" font-weight="700" fill="#4B4B4B">MCP runs outside Cloudflare</text>

    <g transform="rotate(-6 1100 334)">
      <rect x="1040" y="316" width="132" height="34" fill="#05E17A" stroke="#111111" stroke-width="4"/>
      <text x="1106" y="339" text-anchor="middle" font-size="16" font-weight="900" letter-spacing="1" fill="#111111">FREE TIER</text>
    </g>
  </g>
</svg>
