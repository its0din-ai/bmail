<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bmail-banner-title bmail-banner-desc">
  <title id="bmail-banner-title">bmail - inbound email for agents on Cloudflare Workers and R2</title>
  <desc id="bmail-banner-desc">Minimal banner. bmail runs on Cloudflare Workers, receives mail through Email Routing, stores it in R2, and exposes a REST API for your own tools.</desc>

  <rect width="1280" height="360" fill="#F7F7F5"/>
  <rect x="0" y="0" width="1280" height="2" fill="#F38020"/>
  <line x1="660" y1="64" x2="660" y2="296" stroke="#E3E3DE" stroke-width="1"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="104" font-size="11" font-weight="600" letter-spacing="3" fill="#8A8A85">INBOUND EMAIL FOR AGENTS</text>
    <text x="76" y="196" font-size="92" font-weight="600" letter-spacing="-4" fill="#111111">bmail</text>
    <text x="80" y="234" font-size="21" font-weight="400" fill="#55554F">A quiet inbox for autonomous agents.</text>
    <line x1="80" y1="258" x2="200" y2="258" stroke="#111111" stroke-width="1.5"/>
    <text x="80" y="316" font-size="12" fill="#8A8A85">Cloudflare Workers · R2 · Email Routing</text>

    <text x="720" y="96" font-size="10" font-weight="600" letter-spacing="2.5" fill="#8A8A85">DATA PATH</text>
    <text x="1200" y="96" text-anchor="end" font-size="10" font-weight="600" letter-spacing="2.5" fill="#8A8A85">FREE TIER</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <circle cx="710" cy="145" r="3" fill="#F38020"/>
      <text x="724" y="150" font-size="15" font-weight="500" fill="#111111">Email Routing</text>
      <text x="724" y="170" font-size="10" letter-spacing="1.5" fill="#9A9A94">INGRESS</text>

      <line x1="856" y1="146" x2="896" y2="146" stroke="#C9C9C3" stroke-width="1.5"/>
      <path d="M892 142 L900 146 L892 150" fill="none" stroke="#C9C9C3" stroke-width="1.5"/>

      <circle cx="910" cy="145" r="3" fill="#F38020"/>
      <text x="924" y="150" font-size="15" font-weight="500" fill="#111111">Worker</text>
      <text x="924" y="170" font-size="10" letter-spacing="1.5" fill="#9A9A94">COMPUTE</text>

      <line x1="1010" y1="146" x2="1050" y2="146" stroke="#C9C9C3" stroke-width="1.5"/>
      <path d="M1046 142 L1054 146 L1046 150" fill="none" stroke="#C9C9C3" stroke-width="1.5"/>

      <circle cx="1070" cy="145" r="3" fill="#8A8A85"/>
      <text x="1084" y="150" font-size="15" font-weight="500" fill="#111111">R2</text>
      <text x="1084" y="170" font-size="10" letter-spacing="1.5" fill="#9A9A94">STORAGE</text>

      <circle cx="910" cy="241" r="3" fill="#8A8A85"/>
      <text x="924" y="246" font-size="15" font-weight="500" fill="#111111">Your tool</text>
      <text x="924" y="266" font-size="10" letter-spacing="1.5" fill="#9A9A94">AGENT</text>

      <line x1="916" y1="230" x2="916" y2="186" stroke="#C9C9C3" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="M912 190 L916 182 L920 190" fill="none" stroke="#C9C9C3" stroke-width="1.5"/>
      <text x="930" y="214" font-size="10" letter-spacing="1.5" fill="#9A9A94">POLL</text>
    </g>
  </g>
</svg>
